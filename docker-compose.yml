services:
  # ── Neo4j Graph Database ──
  neo4j:
    image: neo4j:5-community
    container_name: pdf-rag-neo4j
    ports:
      - "7474:7474"   # browser Port
      - "7687:7687"   # Bolt Protocol Port
    environment:
      NEO4J_AUTH: neo4j/pdf-rag-analyzer  # username/password should be same to backend/.env
      # enable APOC (for runtime graph operations)
      NEO4J_PLUGINS: '["apoc"]'
      # allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      # optional but useful (runtime export/debug)
      NEO4J_apoc_export_file_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "pdf-rag-analyzer", "RETURN 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Milvus Vector Database (Standalone mode) ──
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: pdf-rag-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:latest
    container_name: pdf-rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.0
    container_name: pdf-rag-milvus
    ports:
      - "19530:19530"  # gRPC port
      - "9091:9091" # health check
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      COMMON_STORAGETYPE: "minio"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
